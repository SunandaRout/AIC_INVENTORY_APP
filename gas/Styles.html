<style>
  :root{
    --navy:#1c2b4a; --navy-dark:#16223b; --teal:#14a5a0; --teal-dark:#0e8985;
    --bg:#f2f4f8; --card:#ffffff; --border:#e7eaf1; --text:#1c2b4a; --muted:#7c869a;
    --danger:#e0554f; --success:#2ea86b; --warning:#c98a12;
    --shadow: 0 2px 10px rgba(28,43,74,0.06); --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  a{text-decoration:none;color:inherit;}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--navy),var(--navy-dark));color:#fff;
    display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:12px;padding:6px 10px 22px 10px;}
  .brand .logo{width:40px;height:40px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:20px;}
  .brand h1{font-size:17px;line-height:1.2;margin:0;font-weight:700;}
  .nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#c7cfe0;font-size:14.5px;font-weight:500;cursor:pointer;}
  .nav a:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav a.active{background:var(--teal);color:#fff;}
  .main{flex:1;padding:28px 30px 60px;min-width:0;}
  .page-head h2{margin:0;font-size:28px;font-weight:800;}
  .page-head p{margin:4px 0 22px;color:var(--muted);font-size:14.5px;}
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;align-items:center;}
  .filters select,.filters input{background:#fff;border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13.5px;color:var(--text);}
  .kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:22px;}
  .kpi-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:1px solid var(--border);}
  .kpi-card .label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:10px;}
  .kpi-card .icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .kpi-card .value{font-size:22px;font-weight:800;}
  .grid3{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:16px;margin-bottom:16px;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:18px;}
  .card h3{margin:0 0 14px;font-size:15.5px;font-weight:700;}
  .chart-wrap{position:relative;height:260px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:9px 10px;border-bottom:1px solid #f1f3f8;}
  .badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.in{background:#e5f7ed;color:var(--success);} .badge.low{background:#fff4de;color:var(--warning);} .badge.out{background:#fde7e6;color:var(--danger);}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
  .search-box{border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13.5px;min-width:220px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(28,43,74,0.35);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-backdrop.open{display:flex;}
  .modal{background:#fff;border-radius:var(--radius);padding:24px;width:420px;max-width:92vw;max-height:86vh;overflow-y:auto;}
  .modal h3{margin-top:0;}
  .form-row{margin-bottom:12px;display:flex;flex-direction:column;gap:5px;}
  .form-row label{font-size:12.5px;color:var(--muted);font-weight:600;}
  .form-row input,.form-row select{border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13.5px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;z-index:200;box-shadow:var(--shadow);}
  .toast.error{background:var(--danger);}
  .spinner{width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty-state{text-align:center;padding:40px;color:var(--muted);}
  .pagination{display:flex;gap:6px;justify-content:flex-end;margin-top:12px;}
  .pagination button{border:1px solid var(--border);background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12.5px;}
  @media (max-width:1200px){.kpi-row{grid-template-columns:repeat(3,1fr);}.grid3{grid-template-columns:1fr 1fr;}}
  @media (max-width:900px){
    .sidebar{position:fixed;left:-260px;z-index:50;transition:left .2s;} .sidebar.open{left:0;}
    .main{padding:20px 16px 40px;} .kpi-row{grid-template-columns:1fr 1fr;} .grid3{grid-template-columns:1fr;}
    .menu-btn{display:inline-flex !important;}
  }
  .menu-btn{display:none;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:14px;cursor:pointer;}
</style>
