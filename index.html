<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIC Inventory App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial;background:#f3f6fa;color:#17233c}.hidden{display:none!important}.app{display:flex;min-height:100vh}.side{width:245px;background:linear-gradient(180deg,#182947,#111d34);color:#fff;padding:20px 14px;flex-shrink:0}.brand{font-size:20px;font-weight:800;padding:8px 10px 22px}.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd4e5;text-align:left;padding:11px 13px;border-radius:9px;margin:3px 0;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#14a5a0;color:#fff}.main{flex:1;padding:28px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0}.card{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:18px;box-shadow:0 3px 14px #17233c0d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.kpi .label{color:#788399;font-size:13px}.kpi .value{font-size:24px;font-weight:800;margin-top:8px}.toolbar{display:flex;gap:10px;margin-bottom:15px}.input,select{border:1px solid #d9dee8;border-radius:8px;padding:10px;background:#fff}.btn{border:0;background:#182947;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:700}.btn.teal{background:#14a5a0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left;font-size:13px}.login{min-height:100vh;display:grid;place-items:center;background:#f3f6fa}.login .card{width:360px}.login h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-size:13px;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #d9dee8;border-radius:8px}.error{color:#d3453f;font-size:13px;margin-top:8px}.muted{color:#788399}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:10}.modal.open{display:grid}.modalbox{background:#fff;border-radius:14px;padding:20px;width:min(520px,92vw)}@media(max-width:900px){.side{width:190px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{display:none}.main{padding:16px}.grid{grid-template-columns:1fr}.head{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body>
<div id="login" class="login"><div class="card"><h2>📦 AIC Inventory</h2><p class="muted">Sign in to manage inventory, sales and purchases.</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password" onkeydown="if(event.key==='Enter')login()"></div><button class="btn teal" style="width:100%" onclick="login()">Sign In</button><div id="loginErr" class="error"></div></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">🏬 AIC Inventory</div><div class="nav" id="nav"></div></aside><main class="main"><div class="head"><div><h1 id="title">Dashboard</h1><div class="muted" id="subtitle">Live business overview</div></div><button class="btn" onclick="logout()">Logout</button></div><div id="content"></div></main></div>
<div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const S={token:null,user:null};
const pages=[['dashboard','📊 Dashboard'],['inventory','📦 Inventory'],['suppliers','🚚 Suppliers'],['customers','👥 Customers'],['purchases','🧾 Purchases'],['sales','📈 Sales'],['receipts','📥 Receipts'],['payments','💳 Payments'],['reports','📑 Reports'],['users','👤 Users'],['settings','⚙️ Settings']];
async function api(action,...args){const r=await fetch('/api/gas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:S.token,args})});const j=await r.json();if(!j.ok)throw Error(j.error||'Request failed');return j.data}
async function login(){document.getElementById('loginErr').textContent='';try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const x=await api('login',email,password);S.token=x.token;S.user=x;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');buildNav();openPage('dashboard')}catch(e){document.getElementById('loginErr').textContent=e.message}}
async function logout(){try{await api('logout')}catch(e){}location.reload()}
function buildNav(){const role=S.user.role;const allowed={Admin:pages.map(x=>x[0]),Manager:['dashboard','inventory','suppliers','customers','purchases','sales','reports'],Staff:['inventory','customers','sales','receipts'],Viewer:['dashboard','reports']}[role]||[];document.getElementById('nav').innerHTML=pages.filter(p=>allowed.includes(p[0])).map(p=>`<button id="nav-${p[0]}" onclick="openPage('${p[0]}')">${p[1]}</button>`).join('')}
function openPage(p){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.getElementById('nav-'+p)?.classList.add('active');document.getElementById('title').textContent=pages.find(x=>x[0]===p)?.[1].replace(/^\S+\s/,'')||p;document.getElementById('content').innerHTML='<div class="card">Loading…</div>';({dashboard:dashboard,inventory:inventory,suppliers:()=>tablePage('suppliers','Suppliers','listSuppliers'),customers:()=>tablePage('customers','Customers','listCustomers'),users:()=>tablePage('users','Users','listUsers'),purchases:()=>tablePage('purchases','Purchases','listPurchases'),sales:()=>tablePage('sales','Sales','listSales'),receipts:()=>tablePage('receipts','Receipts','listReceipts'),payments:()=>tablePage('payments','Payments','listPayments'),reports:reports,settings:settings}[p]||dashboard)()}
async function dashboard(){try{const d=await api('getDashboardData',{});const k=d.kpis||d;document.getElementById('content').innerHTML=`<div class="grid">${[['Total Sales',k.totalSales],['Total Purchases',k.totalPurchases],['Net Profit',k.netProfit],['Inventory Value',k.inventoryValue],['Receivable',k.receivable],['Payable',k.payable]].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]??0}</div></div>`).join('')}</div><br><div class="card"><h3>Dashboard connected</h3><p class="muted">Live data is being loaded from the Apps Script backend.</p></div>`}catch(e){showError(e)}}
async function inventory(){try{const d=await api('listInventory',{});const rows=d.rows||d||[];document.getElementById('content').innerHTML=`<div class="toolbar"><input class="input" id="search" placeholder="Search inventory…"><button class="btn teal" onclick="alert('Use the Add Product form from the connected Apps Script UI, or configure createProduct fields.')">+ Product</button></div><div class="card"><table class="table"><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Quantity</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.sku||''}</td><td>${r.product_name||''}</td><td>${r.category_name||''}</td><td>${r.quantity??0}</td><td>${r.stock_status||''}</td></tr>`).join('')}</tbody></table></div>`}catch(e){showError(e)}}
async function tablePage(key,title,action){try{const d=await api(action,{});const rows=d.rows||d||[];if(!rows.length){document.getElementById('content').innerHTML='<div class="card">No records found.</div>';return}const cols=Object.keys(rows[0]).slice(0,8);document.getElementById('content').innerHTML=`<div class="card"><div style="overflow:auto"><table class="table"><thead><tr>${cols.map(c=>`<th>${c.replaceAll('_',' ')}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}catch(e){showError(e)}}
async function reports(){document.getElementById('content').innerHTML='<div class="card"><h3>Reports</h3><p class="muted">Choose a report to load live data.</p><div class="toolbar"><button class="btn" onclick="runReport(\'getSalesReport\')">Sales</button><button class="btn" onclick="runReport(\'getPurchaseReport\')">Purchases</button><button class="btn" onclick="runReport(\'getInventoryReport\')">Inventory</button><button class="btn" onclick="runReport(\'getProfitReport\')">Profit</button></div><div id="reportOut"></div></div>'}
async function runReport(a){try{const d=await api(a,{}),rows=d.rows||d||[];document.getElementById('reportOut').innerHTML=`<pre style="white-space:pre-wrap;overflow:auto">${escapeHtml(JSON.stringify(rows,null,2))}</pre>`}catch(e){showError(e)}}
async function settings(){document.getElementById('content').innerHTML='<div class="grid"><div class="card"><h3>Google Sheets</h3><p id="sheets">Checking…</p></div><div class="card"><h3>Database</h3><p id="db">Checking…</p></div></div>';try{const s=await api('testSheetsConnection');document.getElementById('sheets').textContent=s.connected?'CONNECTED — '+s.sheetName:'ERROR'}catch(e){document.getElementById('sheets').textContent=e.message}try{const d=await api('testDatabaseConnection');document.getElementById('db').textContent=d.connected?'CONNECTED':'ERROR: '+d.error}catch(e){document.getElementById('db').textContent=e.message}}
function showError(e){document.getElementById('content').innerHTML=`<div class="card"><h3>Function error</h3><p class="error">${escapeHtml(e.message)}</p><p class="muted">Check the Apps Script deployment and Vercel GAS_WEB_APP_URL environment variable.</p></div>`}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
